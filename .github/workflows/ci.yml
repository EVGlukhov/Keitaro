name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          coverage run --data-file=/tmp/keitaro-coverage --branch --source=app -m unittest discover -s tests -v
          coverage report --data-file=/tmp/keitaro-coverage --fail-under=75

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend schema dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate and verify API types
        working-directory: frontend
        run: |
          npm run generate:api-types
          cd ..
          git diff --exit-code -- backend/openapi.json frontend/src/api/schema.generated.ts
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend and accessibility tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start Docker services
        run: docker compose up --detach --build
      - name: Smoke test frontend and proxied backend health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/health; then
              curl --fail --silent http://127.0.0.1:5173/ | grep -q '<title>Keitaro Studio</title>'
              exit 0
            fi
            sleep 2
          done
          echo "Compose health endpoint did not become ready" >&2
          exit 1
      - name: Stop Docker services
        if: always()
        run: docker compose down --volumes

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
