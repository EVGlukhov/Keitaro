services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      KEITARO_URL: ${KEITARO_URL:-}
      KEITARO_API_KEY: ${KEITARO_API_KEY:-}
      DATABASE_URL: sqlite:////data/keitaro_wrapper.db
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - backend_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

volumes:
  backend_data:
